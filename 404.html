<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Redirect unknown paths to index.html while preserving route info.
      var segmentCount = 1;
      var l = window.location;
      var basePath = l.pathname.split("/").slice(0, 1 + segmentCount).join("/");
      var routePath = l.pathname
        .split("/")
        .slice(1 + segmentCount)
        .join("/")
        .replace(/&/g, "~and~");
      var query = l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "";

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          basePath +
          "/?/" +
          routePath +
          query +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
